<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA Mobile - Your Model</title>
    <style>
        * { margin:0; padding:0; touch-action:none; }
        body { overflow:hidden; background:#000; font-family:Arial; }
        #info { position:fixed; top:10px; left:10px; color:#0f0; background:rgba(0,0,0,0.8); padding:10px; border-radius:5px; z-index:1000; font-size:14px; max-width:300px; }
        #joystick { position:fixed; bottom:40px; left:40px; width:120px; height:120px; background:rgba(255,255,255,0.1); border-radius:50%; border:2px solid rgba(255,255,255,0.3); }
        #joystick-thumb { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50px; height:50px; background:rgba(255,255,255,0.8); border-radius:50%; }
        .btn { position:fixed; bottom:40px; right:40px; width:80px; height:80px; background:rgba(255,50,50,0.7); border-radius:50%; border:none; color:white; font-size:24px; font-weight:bold; }
        #loading { position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#0f0; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999; text-align:center; }
        .progress { width:200px; height:10px; background:#333; margin:20px 0; border-radius:5px; overflow:hidden; }
        .progress-bar { height:100%; background:#0f0; width:0%; transition:width 0.3s; }
    </style>
    
    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="loading">
        <h1>GTA MOBILE</h1>
        <p id="status">Loading game...</p>
        <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="model-source">Waiting for model...</p>
    </div>
    
    <div id="info">GTA Mobile | Loading...</div>
    <div id="joystick"><div id="joystick-thumb"></div></div>
    <button class="btn" id="btn-jump">A</button>

    <script>
        // ==================== GTA MOBILE - YOUR MODEL VERSION ====================
        console.log('🎮 GTA Mobile with Your Model');
        
        let scene, camera, renderer, player, mixer;
        let joystickPos = { x: 0, y: 0 };
        let gameLoaded = false;
        
        // UPDATE UI
        function updateUI(text, percent, source = '') {
            document.getElementById('status').textContent = text;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('info').textContent = `GTA Mobile | ${text}`;
            if (source) {
                document.getElementById('model-source').textContent = `Model: ${source}`;
            }
        }
        
        // START GAME
        window.addEventListener('load', async () => {
            try {
                updateUI('Checking Three.js...', 10);
                
                // 1. CHECK THREE.JS
                if (typeof THREE === 'undefined') throw new Error('Three.js not loaded');
                if (typeof THREE.GLTFLoader === 'undefined') throw new Error('GLTFLoader not loaded');
                console.log('✅ Libraries loaded');
                updateUI('Libraries OK', 20);
                
                // 2. CREATE SCENE
                updateUI('Creating scene...', 30);
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                scene.fog = new THREE.Fog(0x87CEEB, 10, 200);
                
                // 3. CREATE CAMERA
                camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                camera.position.set(0, 5, 10);
                
                // 4. CREATE RENDERER
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.shadowMap.enabled = true;
                document.body.appendChild(renderer.domElement);
                updateUI('Renderer OK', 40);
                
                // 5. ADD LIGHTS
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const sun = new THREE.DirectionalLight(0xffffff, 0.8);
                sun.position.set(10, 20, 10);
                sun.castShadow = true;
                scene.add(sun);
                
                // 6. CREATE GROUND
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(100, 100),
                    new THREE.MeshStandardMaterial({ color: 0x228B22 })
                );
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);
                
                // 7. LOAD YOUR MODEL FROM GITHUB
                updateUI('Loading your model...', 50, 'Your GitHub Model');
                await loadYourModel();
                
                // 8. SETUP CONTROLS
                setupControls();
                updateUI('Controls ready', 80);
                
                // 9. HIDE LOADING SCREEN
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    gameLoaded = true;
                    updateUI('Game Ready!', 100);
                    console.log('✅ Game fully loaded');
                }, 1000);
                
                // 10. START GAME LOOP
                animate();
                
            } catch (error) {
                console.error('❌ Game error:', error);
                document.getElementById('loading').innerHTML = 
                    `<h1 style="color:red">ERROR</h1>
                     <p>${error.message}</p>
                     <p style="font-size:12px; color:#888">${error.stack || ''}</p>
                     <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; background:#0f0; border:none; border-radius:5px; color:black; font-weight:bold;">Restart Game</button>`;
            }
        });
        
        // LOAD YOUR MODEL FROM GITHUB
        async function loadYourModel() {
            console.log('🔄 Loading model from GitHub...');
            
            // YOUR GITHUB URLS (try all possible formats)
            const yourModelUrls = [
                // Raw GitHub URL (BEST OPTION)
                'https://raw.githubusercontent.com/crypto-pow/crypto-pow.github.io/main/model.glb',
                'https://raw.githubusercontent.com/crypto-pow/crypto-pow.github.io/master/model.glb',
                
                // Direct GitHub Pages URL (might not work for .glb)
                'https://crypto-pow.github.io/model.glb',
                
                // Fallback models (if yours fails)
                'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
                'https://threejs.org/examples/models/gltf/Duck/glTF-Binary/Duck.glb'
            ];
            
            // Try each URL
            for (let i = 0; i < yourModelUrls.length; i++) {
                const url = yourModelUrls[i];
                const isYourModel = i < 3; // First 3 URLs are yours
                
                console.log(`🔍 Attempt ${i+1}: ${url}`);
                updateUI(`Trying source ${i+1}...`, 50 + i*5, isYourModel ? 'Your model' : 'Fallback');
                
                try {
                    const gltf = await loadGLB(url);
                    if (gltf) {
                        console.log(`✅ Model loaded successfully from: ${url}`);
                        
                        // Setup the model
                        player = gltf.scene;
                        player.scale.set(0.5, 0.5, 0.5);
                        player.position.set(0, 0, 0);
                        
                        // Enable shadows
                        player.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        scene.add(player);
                        
                        // Setup animations if available
                        if (gltf.animations && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(player);
                            const action = mixer.clipAction(gltf.animations[0]);
                            action.play();
                            console.log(`🎬 Playing: ${gltf.animations[0].name}`);
                        }
                        
                        updateUI('Model loaded!', 70, isYourModel ? 'Your model ✓' : 'Fallback model');
                        return true;
                    }
                } catch (error) {
                    console.warn(`⚠️ Failed: ${url}`, error.message);
                    continue;
                }
            }
            
            // If all URLs fail, create simple character
            console.log('❌ All model loading failed, creating simple character');
            createSimpleCharacter();
            return false;
        }
        
        // LOAD GLB HELPER FUNCTION
        function loadGLB(url) {
            return new Promise((resolve, reject) => {
                const loader = new THREE.GLTFLoader();
                const timeout = setTimeout(() => reject(new Error('Timeout loading model')), 15000);
                
                loader.load(
                    url,
                    (gltf) => {
                        clearTimeout(timeout);
                        resolve(gltf);
                    },
                    (xhr) => {
                        // Progress update
                        if (xhr.lengthComputable) {
                            const percent = Math.round(xhr.loaded / xhr.total * 100);
                            updateUI(`Downloading: ${percent}%`, 60);
                        }
                    },
                    (error) => {
                        clearTimeout(timeout);
                        reject(error);
                    }
                );
            });
        }
        
        // CREATE SIMPLE CHARACTER (FALLBACK)
        function createSimpleCharacter() {
            console.log('🎲 Creating simple character...');
            
            const group = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1, 2, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x00ff00 })
            );
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            head.position.y = 2.3;
            head.castShadow = true;
            group.add(head);
            
            player = group;
            scene.add(player);
            
            console.log('✅ Simple character created');
            updateUI('Using simple character', 70, 'Fallback');
        }
        
        // SETUP CONTROLS
        function setupControls() {
            const joystick = document.getElementById('joystick');
            const thumb = document.getElementById('joystick-thumb');
            const btnJump = document.getElementById('btn-jump');
            
            // Joystick movement
            joystick.addEventListener('touchstart', (e) => {
                e.preventDefault();
            });
            
            joystick.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystick.getBoundingClientRect();
                
                // Calculate relative position
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                joystickPos.x = (touch.clientX - centerX) / 40; // Normalize
                joystickPos.y = (touch.clientY - centerY) / 40;
                
                // Limit to circle
                const length = Math.sqrt(joystickPos.x*joystickPos.x + joystickPos.y*joystickPos.y);
                if (length > 1) {
                    joystickPos.x /= length;
                    joystickPos.y /= length;
                }
                
                // Update thumb position
                thumb.style.transform = `translate(calc(-50% + ${joystickPos.x * 40}px), calc(-50% + ${joystickPos.y * 40}px))`;
            });
            
            joystick.addEventListener('touchend', () => {
                joystickPos = { x: 0, y: 0 };
                thumb.style.transform = 'translate(-50%, -50%)';
            });
            
            // Jump button
            btnJump.addEventListener('touchstart', () => {
                if (player) {
                    player.position.y += 0.5;
                    btnJump.style.transform = 'scale(0.9)';
                }
            });
            
            btnJump.addEventListener('touchend', () => {
                if (player) {
                    setTimeout(() => {
                        player.position.y = 0;
                    }, 200);
                }
                btnJump.style.transform = 'scale(1)';
            });
        }
        
        // GAME LOOP
        function animate() {
            requestAnimationFrame(animate);
            
            // Update animations
            if (mixer) {
                mixer.update(0.016);
            }
            
            // Move player based on joystick
            if (player && gameLoaded) {
                player.position.x += joystickPos.x * 0.2;
                player.position.z += joystickPos.y * 0.2;
                
                // Rotate player towards movement
                if (joystickPos.x !== 0 || joystickPos.y !== 0) {
                    player.rotation.y = Math.atan2(joystickPos.x, joystickPos.y);
                }
                
                // Camera follow
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 10;
                camera.position.y = player.position.y + 5;
                camera.lookAt(player.position);
                
                // Update info
                document.getElementById('info').textContent = 
                    `POS: ${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)} | ` +
                    `USE JOYSTICK TO MOVE`;
            }
            
            // Render
            renderer.render(scene, camera);
        }
        
        // RESIZE HANDLER
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        console.log('✅ Game script loaded - Ready to load your model!');
    </script>
</body>
</html>
